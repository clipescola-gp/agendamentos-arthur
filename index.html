<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ClipEscola - Agendar Treinamento - Arthur Montardo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#22367b;--blue2:#1a2d6b;--yellow:#ffca26;--light:#d3e2f2;--white:#fff;--gray:#5a6074;--bg:#f5f7fb;--radius:12px;--shadow:0 4px 24px rgba(34,54,123,.10)}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--blue);min-height:100vh}
header{background:var(--blue);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between}
.badge{background:rgba(255,202,38,.15);border:1px solid rgba(255,202,38,.4);color:var(--yellow);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);padding:48px 32px 56px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,202,38,.07);top:-80px;right:-80px}
.hero-tag{display:inline-block;background:rgba(255,202,38,.15);border:1px solid rgba(255,202,38,.35);color:var(--yellow);font-size:12px;font-weight:700;padding:5px 16px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.hero h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:8px}
.hero p{color:rgba(255,255,255,.75);font-size:15px;max-width:480px;margin:0 auto 20px}
.hero-csm{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:8px 16px}
.csm-av{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue);font-size:14px}
.csm-name{color:#fff;font-weight:700;font-size:13px}
.csm-role{color:rgba(255,255,255,.65);font-size:11px}
.steps-bar{background:#fff;border-bottom:1px solid var(--light);padding:16px 32px;display:flex;align-items:center;justify-content:center}
.step-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray)}
.step-item.active{color:var(--blue)}.step-item.done{color:#057a55}
.step-num{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step-item.active .step-num{background:var(--blue);border-color:var(--blue);color:#fff}
.step-item.done .step-num{background:#057a55;border-color:#057a55;color:#fff}
.step-sep{width:32px;height:2px;background:var(--light);margin:0 4px}
.main{max-width:680px;margin:0 auto;padding:32px 24px}
.card{background:#fff;border:1px solid var(--light);border-radius:var(--radius);padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:800;margin-bottom:20px;color:var(--blue)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-group.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
input{width:100%;padding:10px 13px;border-radius:8px;border:1.5px solid var(--light);background:var(--bg);color:var(--blue);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border .2s}
input:focus{border-color:var(--blue)}
input.input-error{border-color:#f05252;}
.btn{display:inline-block;padding:12px 28px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:'Nunito',sans-serif}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:#fff;color:var(--blue);border:1.5px solid var(--light)}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light);font-size:14px}
.summary-row:last-child{border-bottom:none}
.summary-row span:first-child{color:var(--gray);font-weight:600}
.alert{background:#fffbea;border:1px solid rgba(255,202,38,.5);border-radius:8px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:16px}
.error-box{background:#fde8e8;border:1px solid #f8b4b4;border-radius:8px;padding:12px 16px;font-size:13px;color:#9b1c1c;margin-top:12px;line-height:1.6}
.success-card{text-align:center;padding:48px 32px}
.success-icon{width:64px;height:64px;border-radius:50%;background:#def7ec;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:28px}
.success-card h2{font-size:22px;font-weight:800;margin-bottom:10px;color:#057a55}
.success-card .sub{color:var(--gray);font-size:14px;line-height:1.7;margin-bottom:24px}
.meet-link-box{background:var(--bg);border:1.5px solid var(--light);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--gray);word-break:break-all;margin-bottom:20px;text-align:left}
.meet-link-box strong{display:block;margin-bottom:4px;color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.new-btn{background:none;border:1.5px solid var(--light);color:var(--gray);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif}
footer{text-align:center;padding:32px;color:var(--gray);font-size:12px;border-top:1px solid var(--light);margin-top:16px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.form-group.full{grid-column:auto}.hero h1{font-size:22px}.main{padding:20px 16px}}
</style>
</head>
<body>
<header><img src="https://i.imgur.com/IVPOWqc.png" alt="ClipEscola" style="height:36px;object-fit:contain"/><div class="badge">Agendamento</div></header>
<div class="hero">
  <div class="hero-tag">Reuniao de Treinamento</div>
  <h1>Agendar com Arthur Montardo</h1>
  <p>Escolha o melhor horario para a reuniao de treinamento do seu modulo financeiro.</p>
  <div class="hero-csm"><div class="csm-av">AM</div><div><div class="csm-name">Arthur Montardo</div><div class="csm-role">Gerente de Produtos Financeiros</div></div></div>
</div>
<div class="steps-bar" id="sb"></div>
<div class="main"><div id="ct"></div></div>
<footer>ClipEscola - Reuniao conduzida por <strong>Arthur Montardo</strong> - Gerente de Produtos Financeiros</footer>
<script>
var CSM={"name":"Arthur Montardo","title":"Gerente de Produtos Financeiros","email":"arthurmontardo.clipescola@gmail.com","icsUrl":"https://calendar.google.com/calendar/ical/arthurmontardo.clipescola%40gmail.com/private-0b17c114bce7286b5a663c1680bfb490/basic.ics","active":true,"slots":[{"day":1,"time":"09:30"},{"day":1,"time":"14:30"},{"day":2,"time":"09:30"},{"day":2,"time":"14:30"},{"day":3,"time":"09:30"},{"day":3,"time":"14:30"},{"day":4,"time":"09:30"},{"day":4,"time":"14:30"},{"day":5,"time":"09:30"},{"day":5,"time":"14:00"}]};
var CFG={"webhookVerificar":"https://n8n.clipescola.com.br/webhook/verificar-disponibilidade-gpf","webhookAgendar":"https://n8n.clipescola.com.br/webhook/agendar-gpf","calendarId":"clipescola@clipescola.sale","sheetId":"16OBANG9-vCMmCZpmQUcgcYR2m_EK9RD5TNV5Gm9_2ow","slaHours":48,"meetingTitle":"Reunião ClipEscola — Produtos Financeiros","meetingDuration":120};
var SC=[{"day":1,"time":"09:30"},{"day":1,"time":"14:30"},{"day":2,"time":"09:30"},{"day":2,"time":"14:30"},{"day":3,"time":"09:30"},{"day":3,"time":"14:30"},{"day":4,"time":"09:30"},{"day":4,"time":"14:30"},{"day":5,"time":"09:30"},{"day":5,"time":"14:00"}];
var step=1,form={school:'',contact:'',email:'',phone:'',guests:''},chosen=null,meetUrl='',avail=[];
function ft(d){return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function fd(d){return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});}
function am(d,m){return new Date(d.getTime()+m*60000);}
function es(s){var x=document.createElement('div');x.textContent=s;return x.innerHTML;}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function buildCal(slots){
var M=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var D=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
var bm={};
for(var i=0;i<slots.length;i++){
  var s=slots[i];var dt=new Date(s.datetime);
  var mk=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  if(!bm[mk])bm[mk]={y:dt.getFullYear(),mo:dt.getMonth(),sl:[]};
  bm[mk].sl.push({dt:dt,idx:i});
}
var html='';var mks=Object.keys(bm).sort();
for(var mi=0;mi<mks.length;mi++){
  var g=bm[mks[mi]];
  var fd=new Date(g.y,g.mo,1).getDay();
  var dim=new Date(g.y,g.mo+1,0).getDate();
  var sm={};
  for(var si=0;si<g.sl.length;si++){var ss=g.sl[si];var dd=ss.dt.getDate();if(!sm[dd])sm[dd]=[];sm[dd].push(ss);}
  var hd='';for(var di=0;di<D.length;di++){hd+='<div style="text-align:center;font-size:11px;font-weight:700;color:#5a6074;padding:4px 0">'+D[di]+'</div>';}
  var gr='';for(var ei=0;ei<fd;ei++)gr+='<div></div>';
  for(var n=1;n<=dim;n++){
    var ds=sm[n]||[];
    if(!ds.length){gr+='<div style="min-height:52px;border-radius:8px;background:#f5f7fb;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c0c8d8;font-weight:600">'+n+'</div>';}
    else{var ts2='';for(var ti=0;ti<ds.length;ti++){var sl2=ds[ti];ts2+='<button onclick="pick('+sl2.idx+')" style="display:block;width:100%;padding:2px 0;border:none;background:none;cursor:pointer;font-size:11px;font-weight:700;color:#1a56db;font-family:Nunito,sans-serif;border-radius:4px">'+ft(sl2.dt)+'</button>';}
      gr+='<div style="min-height:52px;border-radius:8px;background:#e8f0fe;border:1.5px solid #c5d8f8;padding:4px 3px"><div style="text-align:center;font-size:12px;font-weight:800;color:#22367b;margin-bottom:2px">'+n+'</div>'+ts2+'</div>';}
  }
  html+='<div style="margin-bottom:28px"><div style="font-weight:800;font-size:15px;color:#22367b;margin-bottom:12px">'+M[g.mo]+' '+g.y+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">'+hd+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+gr+'</div></div>';
}
return html;
}
function rst(){
  var it=[['1','Dados'],['2','Horario'],['3','Confirmacao']];var h='';
  for(var i=0;i<it.length;i++){var n=it[i][0],l=it[i][1],s=i+1,c=s<step?'done':s===step?'active':'';
    h+=(i?'<div class="step-sep"></div>':'')+'<div class="step-item '+c+'"><div class="step-num">'+(s<step?'v':n)+'</div>'+l+'</div>';}
  document.getElementById('sb').innerHTML=h;
}
function s1(){
  document.getElementById('ct').innerHTML='<div class="card"><h2>Dados da instituicao</h2><div class="form-row">'
    +'<div class="form-group full"><label>Nome da instituicao</label><input id="fs" value=""/></div>'
    +'<div class="form-group"><label>Responsavel</label><input id="fc" value=""/></div>'
    +'<div class="form-group"><label>E-mail</label><input id="fe" type="email" value=""/></div>'
    +'<div class="form-group"><label>Telefone</label><input id="fp" value=""/></div>'
    +'<div class="form-group full"><label>Convidados (opcional, separe por virgula)</label><input id="fg" placeholder="email1@exemplo.com, email2@exemplo.com" value=""/></div>'
    +'</div><div style="margin-top:20px"><button class="btn btn-primary" onclick="s2()">Ver horarios disponiveis</button></div></div>';
}
async function s2(){
  form={school:gv('fs'),contact:gv('fc'),email:gv('fe'),phone:gv('fp'),guests:gv('fg')};
  if(!form.school||!form.contact||!form.email||!form.phone){alert('Preencha todos os campos.');return;}
  step=2;rst();
  document.getElementById('ct').innerHTML='<div class="card"><h2>Escolha o horario</h2><p style="color:#5a6074;font-size:13px">Verificando disponibilidade...</p></div>';
  try{
    var r=await fetch(CFG.webhookVerificar,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csmEmail:CSM.email,csmIcsUrl:CSM.icsUrl,slots:SC,slaHours:CFG.slaHours})});
    var d=await r.json();avail=Array.isArray(d)?d:(d.slots||[]);
    if(!avail.length)throw new Error('empty');
  }catch(e){avail=loc();}
  s2r();
}
function loc(){
  var now=new Date(),sla=CFG.slaHours*3600000,res=[];
  var nowSP=new Date(now.toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
  for(var d=0;d<28&&res.length<15;d++){
    var dt=new Date(nowSP);dt.setDate(dt.getDate()+d);dt.setHours(0,0,0,0);
    for(var i=0;i<SC.length;i++){var s=SC[i];if(s.day!==dt.getDay())continue;
      var p=s.time.split(':');var h=parseInt(p[0]),m=parseInt(p[1]);
      var sd=new Date(dt);sd.setHours(h,m,0,0);
      if(sd-nowSP>=sla)res.push({datetime:sd.toISOString()});}
  }
  return res;
}
function s2r(){
  if(!avail.length){document.getElementById('ct').innerHTML='<div class="card"><h2>Escolha o horario</h2><div class="alert">Nenhum horario disponivel.</div></div>';return;}
  var tzNote='<p style="color:#5a6074;font-size:11px;margin-bottom:16px">🕐 Todos os horarios estao no fuso horario de Sao Paulo (GMT-3)</p>';
  document.getElementById('ct').innerHTML='<div class="card"><h2>Escolha o horario</h2>'+tzNote+buildCal(avail)+'</div>';
}
function pick(i){
  chosen=avail[i];step=3;rst();
  var dt=new Date(chosen.datetime),end=am(dt,CFG.meetingDuration);
  var rows=[['Instituicao',form.school],['Responsavel',form.contact],['E-mail',form.email],['Telefone',form.phone]];
  if(form.guests)rows.push(['Convidados',form.guests]);
  rows.push(['Data',fd(dt)],['Horario',ft(dt)+' - '+ft(end)],['Duracao',CFG.meetingDuration+' min']);
  var rh='';for(var ri=0;ri<rows.length;ri++){rh+='<div class="summary-row"><span>'+rows[ri][0]+'</span><span>'+es(String(rows[ri][1]))+'</span></div>';}
  document.getElementById('ct').innerHTML='<div class="card"><h2>Confirmar agendamento</h2><div style="margin-bottom:20px">'+rh+'</div><div id="er"></div><div style="display:flex;gap:10px"><button class="btn btn-secondary" onclick="bk()">Voltar</button><button class="btn btn-primary" id="bc" onclick="cf()">Confirmar agendamento</button></div></div>';
}
function bk(){step=2;rst();s2r();}
async function cf(){
  var btn=document.getElementById('bc');
  btn.disabled=true;btn.textContent='Confirmando...';
  try{
    var att=[{email:form.email},{email:CSM.email}];
    if(form.guests)form.guests.split(',').map(function(e){return e.trim();}).filter(Boolean).forEach(function(e){att.push({email:e});});
    var dt=new Date(chosen.datetime);
    var spOpts={timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'};
    var spDateParts=dt.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
    var spTime=dt.toLocaleTimeString('pt-BR',spOpts);
    var pl={school:form.school,contact:form.contact,email:form.email,phone:form.phone,guests:form.guests,
      date:spDateParts,time:spTime,
      csmEmail:CSM.email,csmName:CSM.name,calendarId:CFG.calendarId,
      sheetId:CFG.sheetId,durationMinutes:CFG.meetingDuration,
      sheetData:{Data:dt.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}),Horario:spTime,Escola:form.school,Responsavel:form.contact,Email:form.email,Telefone:form.phone,CSM:CSM.name}};

    var r=await fetch(CFG.webhookAgendar,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)});
    var d=await r.json();

    // ── Tratamento de erro retornado pelo workflow ──────────────────────────
    if(d.success===false){
      var msg=d.message||'Erro ao agendar. Verifique os dados e tente novamente.';
      var extra='';
      if(d.invalidEntries&&d.invalidEntries.length){
        extra='<br><strong>Entradas inválidas:</strong> '+d.invalidEntries.map(function(e){return es(e);}).join(', ');
      }
      btn.disabled=false;btn.textContent='Confirmar agendamento';
      document.getElementById('er').innerHTML='<div class="error-box">⚠️ '+es(msg)+extra+'</div>';
      return;
    }
    // ──────────────────────────────────────────────────────────────────────

    meetUrl=d.meetLink||d.hangoutLink||d.htmlLink||'';
    ok();
  }catch(e){
    btn.disabled=false;btn.textContent='Confirmar agendamento';
    document.getElementById('er').innerHTML='<div class="error-box">⚠️ Não foi possível confirmar o agendamento. Tente novamente ou entre em contato com seu CSM.</div>';
  }
}
function ok(){
  var dt=new Date(chosen.datetime),end=am(dt,CFG.meetingDuration);
  document.getElementById('sb').style.display='none';
  var ml='';
  if(meetUrl){
    var mu=meetUrl;
    ml='<div class="meet-link-box"><strong>Link da reuniao</strong>'
      +'<div style="display:flex;align-items:center;gap:8px;margin-top:4px">'
      +'<span style="flex:1;word-break:break-all;font-size:13px;color:#22367b">'+mu+'</span>'
      +'<button id="cpbtn" style="flex-shrink:0;padding:6px 14px;border-radius:6px;border:1.5px solid #d3e2f2;background:#fff;color:#22367b;font-weight:700;font-size:12px;cursor:pointer;font-family:Nunito,sans-serif">Copiar</button>'
      +'</div></div>';
  }
  document.getElementById('ct').innerHTML='<div class="success-card card">'
    +'<div class="success-icon">🎉</div>'
    +'<h2>Agendamento confirmado!</h2>'
    +'<p class="sub"><strong>'+es(form.school)+'</strong><br>'+fd(dt)+' - '+ft(dt)+' - '+ft(end)+'<br>Um convite foi enviado para <strong>'+es(form.email)+'</strong></p>'
    +ml
    +'<button class="new-btn" onclick="nr()">Fazer novo agendamento</button>'
    +'</div>';
  if(meetUrl){var mu2=meetUrl;document.getElementById('cpbtn').addEventListener('click',function(){navigator.clipboard.writeText(mu2).then(function(){var b=document.getElementById('cpbtn');if(b){b.textContent='Copiado!';setTimeout(function(){b.textContent='Copiar';},2000);}});});}
}
function nr(){step=1;form={school:'',contact:'',email:'',phone:'',guests:''};chosen=null;meetUrl='';document.getElementById('sb').style.display='';rst();s1();}
rst();s1();
</script>
</body>
</html>
